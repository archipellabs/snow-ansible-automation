---
# Custom EDA decision environment: de-minimal + servicenow.itsm (for the
# servicenow.itsm.records event source used by the rulebook). Built with ansible-builder.
#
# Red Hat's recommended base for a custom DE is de-minimal (it already ships ansible.eda);
# we only add servicenow.itsm, which is in no stock decision environment. ansible-builder re-resolves
# the image's Python requirements at assemble time, and the chain now pulls systemd-python (a COMPILED
# wheel) — so de-minimal's build env needs the C/Python headers below, or the build dies with
# "Python.h: No such file or directory". Despite the file name (the one ansible-builder requires), this
# produces a DECISION environment, not an execution one.
version: 3

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-27/de-minimal-rhel9:latest

options:
  package_manager_path: /usr/bin/microdnf

dependencies:
  galaxy:
    collections:
      - name: servicenow.itsm
  system:
    - python3.12-devel [platform:rpm]    # Python.h — systemd-python (pulled transitively) compiles a wheel
    - gcc [platform:rpm]
    - systemd-devel [platform:rpm]        # libsystemd headers for systemd-python
    - pkgconf-pkg-config [platform:rpm]
