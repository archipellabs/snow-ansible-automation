---
# Declarative EDA config — the data behind infra.aap_configuration (see ../configure.yml).
# Replaces the former per-pattern Python configure scripts: each event stream and activation is now
# a row here, not a near-duplicate Python file.
#
# The one-time base (decision environment, credentials, EDA project) is still created by
# configure.py. Secrets are NEVER in this file — aap_* and sn_* are injected by the JT's "AAP Config"
# credential as extra vars. 'source_name' must match the named source inside each rulebook.
# 'organization' is required by the roles.

# Inbound endpoints (gateway-managed). They reuse the shared ServiceNow event-stream token credential.
# forward_events: true => production routing (NOT test mode) -> events are forwarded to the activation.
eda_event_streams:
  # Only `change` stays push, so only its stream remains (self-service + onboarding are pull now).
  - { name: servicenow-chg-stream,        organization: Default, forward_events: true, credential_name: "ServiceNow CHG Event Stream cred" }

eda_rulebook_activations:
  # PULL — records source; no event stream; injects SN_* for the records poller.
  - name: pull-incident-remediation
    organization: Default
    project: snow-ansible-automation
    rulebook: pull_incident_remediation.yml
    decision_environment: snow-eda-de
    eda_credentials: ["AAP Controller"]
    restart_policy: on-failure
    extra_vars: |
      SN_HOST: https://{{ sn_instance }}
      SN_USERNAME: {{ sn_eda_username }}
      SN_PASSWORD: {{ sn_eda_password }}

  # MONITOR — url_check internal source; no event stream.
  - name: monitor-health
    organization: Default
    project: snow-ansible-automation
    rulebook: monitor_health_open_incident.yml
    decision_environment: snow-eda-de
    eda_credentials: ["AAP Controller"]
    restart_policy: on-failure

  # PUSH — webhook source bound to its event stream. Only `change` stays push: its approval-driven
  # flow + flat change record make the Business Rule payload trivial, and it keeps the push pattern demoed.
  - name: push-change-execution
    organization: Default
    project: snow-ansible-automation
    rulebook: push_change_execution.yml
    decision_environment: snow-eda-de
    eda_credentials: ["AAP Controller"]
    restart_policy: on-failure
    event_streams:
      - { event_stream: servicenow-chg-stream, source_name: servicenow_webhook }

  # PULL (catalog) — records source on sc_req_item; the job's playbook fetches the form's catalog
  # variables by request_sysid. Was push (Business Rule -> Event Stream); moved to pull (no stream).
  - name: pull-selfservice-restart
    organization: Default
    project: snow-ansible-automation
    rulebook: pull_selfservice_restart.yml
    decision_environment: snow-eda-de
    eda_credentials: ["AAP Controller"]
    restart_policy: on-failure
    extra_vars: |
      SN_HOST: https://{{ sn_instance }}
      SN_USERNAME: {{ sn_eda_username }}
      SN_PASSWORD: {{ sn_eda_password }}

  - name: pull-onboarding
    organization: Default
    project: snow-ansible-automation
    rulebook: pull_employee_onboarding.yml
    decision_environment: snow-eda-de
    eda_credentials: ["AAP Controller"]
    restart_policy: on-failure
    extra_vars: |
      SN_HOST: https://{{ sn_instance }}
      SN_USERNAME: {{ sn_eda_username }}
      SN_PASSWORD: {{ sn_eda_password }}
