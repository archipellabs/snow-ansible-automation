---
# Declarative EDA config-as-code: event streams + rulebook activations via infra.aap_configuration.
# Replaces configure_push/monitor/selfservice/onboarding.py — the data lives in vars/eda.yml.
#
# Runs as the **"Configure EDA" job template** (GitOps: AAP configures itself from this Git project).
# The connection + ServiceNow secrets are injected by the JT's "AAP Config" credential as extra vars
# (aap_hostname / aap_username / aap_password / sn_*). The one-time base (decision environment,
# credentials, EDA project) is still created by configure.py; the eda_* roles don't reliably support
# token auth, hence username/password.
#
# Idempotency note: EDA cannot update a *running* activation in place ("not in disabled mode and in
# stopped status"), so we reconcile activations by **delete-then-create** — every apply briefly
# recreates them (see README Limitations). Event streams reconcile in place (present only).
- name: Configure EDA event streams and rulebook activations (declarative)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_validate_certs: false        # the gateway uses a self-signed cert
  vars_files:
    - vars/eda.yml
  tasks:
    - name: Reconcile event streams (idempotent, in place)
      ansible.builtin.include_role:
        name: infra.aap_configuration.eda_event_streams

    - name: Remove existing activations (EDA can't update a running one)
      ansible.builtin.include_role:
        name: infra.aap_configuration.eda_rulebook_activations
      vars:
        eda_rulebook_activations: "{{ eda_rulebook_activations | map('combine', {'state': 'absent'}) | list }}"

    - name: Create activations
      ansible.builtin.include_role:
        name: infra.aap_configuration.eda_rulebook_activations
