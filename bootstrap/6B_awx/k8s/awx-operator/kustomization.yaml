apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: awx
resources:
  - github.com/ansible/awx-operator/config/default?ref=2.19.1
images:
  - name: quay.io/ansible/awx-operator
    newTag: 2.19.1
  # awx-operator 2.19.1 references gcr.io/kubebuilder/kube-rbac-proxy, removed from gcr.io (404) →
  # remap the sidecar to the maintained community mirror so the operator pod can start.
  - name: gcr.io/kubebuilder/kube-rbac-proxy
    newName: quay.io/brancz/kube-rbac-proxy
    newTag: v0.18.0
