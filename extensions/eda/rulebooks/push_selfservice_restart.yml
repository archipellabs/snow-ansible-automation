---
# PUSH (self-service): ServiceNow catalog requests trigger a service restart on the fleet.
# A Business Rule on sc_req_item POSTs to an AAP Event Stream (managed endpoint on the gateway,
# :443, token auth); the activation maps that stream onto the ansible.eda.webhook source below,
# which launches the "Restart Service (Self-Service)" job template. Mirrors push_change_execution.yml
# — only the payload fields and the job differ. No NSG port is published (the stream lives on :443).
- name: Restart a service from a ServiceNow self-service request (push via Event Stream)
  hosts: all
  sources:
    - name: servicenow_catalog_webhook
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
  rules:
    - name: Self-service request -> run the restart job
      condition: event.payload.request_sysid is defined
      action:
        run_job_template:
          name: "Restart Service (Self-Service)"
          organization: "Default"
          job_args:
            extra_vars:
              request_number: "{{ event.payload.request_number }}"
              request_sysid: "{{ event.payload.request_sysid }}"
              target_host: "{{ event.payload.target_host }}"
