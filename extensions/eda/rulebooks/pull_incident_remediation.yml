---
# EDA (pull): detect incidents in ServiceNow and trigger service remediation on the fleet.
# Discovery: AAP EDA only finds rulebooks under extensions/eda/rulebooks/ (or rulebooks/).
# Source: servicenow.itsm.records polls the incident table. SN_HOST / SN_USERNAME /
# SN_PASSWORD are provided by the rulebook activation's variables.
- name: Auto-remediate incident (ServiceNow -> EDA -> AAP)
  hosts: all
  sources:
    - servicenow.itsm.records:
        instance:
          host: "{{ SN_HOST }}"
          username: "{{ SN_USERNAME }}"
          password: "{{ SN_PASSWORD }}"
        table: incident
        # Trigger filter (see bootstrap/4_servicenow/1_account.py): dedicated group + New state.
        sysparm_query: "assignment_group.name=Auto-Remediation^state=1"
        interval: 10
        # The source builds its poll-window filter with gs.dateGenerate, which ServiceNow
        # evaluates in the querying user's timezone. Pinning UTC here only works because
        # bootstrap/4_servicenow/1_account.py sets eda.integration's timezone to GMT; otherwise
        # the window shifts and new incidents are never matched.
        remote_servicenow_timezone: UTC
  rules:
    - name: New incident in Auto-Remediation -> launch remediation
      condition: event.number is defined
      action:
        run_job_template:
          name: "Restart Service"
          organization: "Default"
          job_args:
            extra_vars:
              incident_number: "{{ event.number }}"
              # cmdb_ci comes back as a raw sys_id, so derive the target host from the
              # short_description, which is created as "<host> ...".
              target_host: "{{ event.short_description.split(' ')[0] }}"
