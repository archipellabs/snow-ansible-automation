---
# EDA: detect "ping server" incidents in ServiceNow and trigger remediation.
# Discovery: AAP EDA only finds rulebooks under extensions/eda/rulebooks/ (or rulebooks/).
# Source: servicenow.itsm.records polls the incident table. SN_HOST / SN_USERNAME /
# SN_PASSWORD are provided by the rulebook activation's variables.
- name: Auto-remediate "ping server" incident (ServiceNow -> EDA -> AAP)
  hosts: all
  sources:
    - servicenow.itsm.records:
        instance:
          host: "{{ SN_HOST }}"
          username: "{{ SN_USERNAME }}"
          password: "{{ SN_PASSWORD }}"
        table: incident
        # Trigger filter (see bootstrap/servicenow/setup.py): dedicated group + New state.
        sysparm_query: "assignment_group.name=Auto-Remediation^state=1"
        interval: 10
        # The source errors out without a resolvable timezone; pin it.
        remote_servicenow_timezone: UTC
  rules:
    - name: New incident in Auto-Remediation -> launch remediation
      condition: event.number is defined
      action:
        run_job_template:
          name: "Remediate Ping Server"
          organization: "Default"
          job_args:
            extra_vars:
              incident_number: "{{ event.number }}"
              # cmdb_ci comes back as a raw sys_id, so derive the target host from the
              # short_description, which is created as "<host> ...".
              target_host: "{{ event.short_description.split(' ')[0] }}"
