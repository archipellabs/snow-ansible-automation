# Dynamic inventory of the Meridian fleet, sourced from the ServiceNow CMDB (servicenow.itsm.now).
# The CMDB is the source of truth: add/retire a server CI in ServiceNow and it appears/leaves here on
# the next sync. Auth: the inventory source's ServiceNow credential injects SN_HOST/SN_USERNAME/
# SN_PASSWORD, which this plugin reads.
#
# The plugin fetches with sysparm_display_value=true, so reference fields (support_group) come back as
# their display name and the u_* custom columns (written by bootstrap/4_servicenow/2_cmdb.py) as text.
# Two consequences handled below:
#   - ServiceNow renders Integer fields with a thousands separator under display values, so u_ssh_port
#     reads as "2,211" -> strip the comma before casting ansible_port (a known servicenow.itsm quirk).
#   - The PDI ships ~6 out-of-the-box sample Linux servers; 'query: u_role ISNOTEMPTY' scopes the
#     inventory to the Meridian fleet (only our CIs carry u_role).
# u_ssh_port is itself a simulator artifact — real servers would use the CI's real IP + SSH :22.
plugin: servicenow.itsm.now
table: cmdb_ci_linux_server
inventory_hostname_source: name
query:
  - u_role: ISNOTEMPTY        # only the Meridian fleet, not the PDI's sample Linux servers
columns:
  - name
  - u_ssh_port
  - u_service
  - u_role
  - support_group             # standard reference field -> display name (e.g. "HR-IT")
compose:
  # The EE/job reaches the fleet via the host's published SSH ports. ansible_host (the VM address) is NOT
  # set here — it's the same VM for every host (mono-machine), so each runtime sets it once as an
  # inventory variable in controller/configure.py: host.containers.internal on AAP, the k3s node gateway
  # on AWX. Keeps this shared CMDB source neutral. See docs/10 · Notes (Limitations).
  ansible_port: u_ssh_port | regex_replace(',', '') | int   # "2,211" -> 2211
  service: u_service
  role: u_role
keyed_groups:
  - { key: u_role, prefix: role }            # role_web / role_db / role_app / role_mail
  - { key: support_group, prefix: team }     # team_HR-IT / team_DBA / ...
