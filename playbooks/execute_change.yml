---
# execute_change.yml — execute an approved ServiceNow Change Request on a fleet server.
#
# Pattern : PUSH (change-driven). Launched by the "Execute Change Request" job template, which EDA
#           triggers from a ServiceNow Business Rule via an Event Stream when a change is approved.
# Extra vars (from the rulebook):
#   change_number : the change request number (for messages)
#   change_sysid  : the change request sys_id (to annotate the record)
#   target_host   : the target server — must exist in the "Meridian Fleet" inventory
# Host vars (from the inventory):
#   service : the systemd unit to (re)start (role-aware: hr-portal | crm | ged | httpd | postgresql | postfix)
# ServiceNow credentials are injected by the controller credential as SN_HOST/SN_USERNAME/SN_PASSWORD.
#
# The "change" applied here is a service refresh: it records a change marker, restarts the server's
# service, then verifies it is active. The result is written back as a work note via the generic
# servicenow.itsm.api module (ServiceNow's change state model rejects arbitrary Table-API state
# transitions, so the PoC annotates the change rather than driving its lifecycle).
- name: Execute ServiceNow Change Request
  hosts: "{{ target_host }}"
  gather_facts: false
  tasks:
    - name: Apply the change - ensure the marker directory exists
      become: true
      ansible.builtin.file:
        path: /var/lib/meridian
        state: directory
        mode: "0755"

    - name: Apply the change - record a change marker
      become: true
      ansible.builtin.copy:
        dest: /var/lib/meridian/last_change
        content: "change={{ change_number }} service={{ service }} host={{ target_host }}\n"
        mode: "0644"

    - name: Apply the change - (re)start the service
      become: true
      ansible.builtin.systemd:
        name: "{{ service }}"
        state: restarted
        enabled: true

    - name: Verify the service is active
      become: true
      ansible.builtin.command: "systemctl is-active {{ service }}"
      register: check
      changed_when: false
      failed_when: false

    - name: Record the successful execution on the change request
      delegate_to: localhost
      run_once: true
      servicenow.itsm.api:
        resource: change_request
        action: patch
        sys_id: "{{ change_sysid }}"
        data:
          work_notes: >-
            Change {{ change_number }} executed by AAP on {{ target_host }}:
            restarted {{ service }} (now {{ check.stdout }}).
      when: check.stdout == "active"

    - name: Flag the change request if execution failed
      delegate_to: localhost
      run_once: true
      servicenow.itsm.api:
        resource: change_request
        action: patch
        sys_id: "{{ change_sysid }}"
        data:
          work_notes: >-
            Change {{ change_number }} execution FAILED on {{ target_host }}
            ({{ service }} not active: {{ check.stdout }}).
      when: check.stdout != "active"
