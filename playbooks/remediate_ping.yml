---
# "Ping server" incident remediation.
# Launched by the job template (triggered by EDA). Receives as extra_vars:
#   incident_number : the ServiceNow incident number
#   target_host     : the target host (must exist in the controller inventory)
# ServiceNow credentials are injected by the controller credential via
#   SN_HOST / SN_USERNAME / SN_PASSWORD (read by the servicenow.itsm collection).
- name: Remediate "ping server" incident
  hosts: "{{ target_host }}"
  gather_facts: false
  vars:
    service_name: httpd
    recheck_delay: 30
  tasks:
    - name: Remediation - (re)start the service
      become: true
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: restarted
        enabled: true

    - name: Wait before re-check
      ansible.builtin.pause:
        seconds: "{{ recheck_delay }}"

    - name: Re-check - is the service responding?
      ansible.builtin.uri:
        url: http://localhost/
        status_code: 200
      register: check
      ignore_errors: true

    - name: Resolve the incident if remediation succeeded
      delegate_to: localhost
      run_once: true
      servicenow.itsm.incident:
        number: "{{ incident_number }}"
        state: resolved
        close_code: "Solution provided"
        close_notes: >-
          Service {{ service_name }} restarted automatically (AAP) on {{ target_host }}.
          HTTP re-check OK.
        other:
          work_notes: "Auto-remediation EDA->AAP: restarted {{ service_name }}, HTTP {{ check.status | default('?') }}."
      when: check is succeeded and (check.status | default(0)) == 200

    - name: Escalate the incident if remediation failed
      delegate_to: localhost
      run_once: true
      servicenow.itsm.incident:
        number: "{{ incident_number }}"
        state: in_progress
        other:
          work_notes: >-
            Auto-remediation FAILED on {{ target_host }} (service {{ service_name }} still down). Escalating to L2.
      when: not (check is succeeded and (check.status | default(0)) == 200)
