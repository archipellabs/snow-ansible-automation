---
# Meridian Group — the simulated IT estate. Single source of truth: this manifest feeds the
# ServiceNow CMDB (2_cmdb.py), the target containers (compose), and the controller inventory.
# Everything is fictional; *.meridian.example is a documentation domain.
company: Meridian Group
domain: meridian.example

# Support teams = ServiceNow assignment groups.
teams:
  - {name: HR-IT, description: HR applications support}
  - {name: CRM Team, description: CRM applications support}
  - {name: Collab, description: Intranet and collaboration}
  - {name: ECM, description: Document management support}
  - {name: Infra, description: Shared infrastructure and messaging}
  - {name: DBA, description: Database administration (cross-application)}
  - {name: Auto-Remediation, description: Incidents eligible for automated remediation (EDA trigger)}

# Applications = the real code under apps/ (FastAPI) or a static site. `service` is the systemd
# unit name inside the container; `port` is the app's internal listen port.
apps:
  hr-portal: {kind: fastapi, service: hr-portal, port: 8000, path: simulator/apps/hr-portal}
  crm:       {kind: fastapi, service: crm,       port: 8000, path: simulator/apps/crm}
  ged:       {kind: fastapi, service: ged,       port: 8000, path: simulator/apps/ged}
  intranet:  {kind: static,  service: httpd,     port: 80,   path: simulator/apps/intranet}

# Business services = what users consume. `app` ties a service to its application.
business_services:
  - {name: HR Self-Service,      app: hr-portal, criticality: 2 - high}
  - {name: Customer Relations,      app: crm,       criticality: 1 - critical}
  - {name: Intranet,             app: intranet,  criticality: 3 - moderate}
  - {name: Document Management, app: ged,       criticality: 3 - moderate}
  - {name: Mail,           app: null,      criticality: 2 - high}

# Servers = CMDB Linux server CIs and the containers that stand in for them.
#   role            : web | app | db | mail  (drives which systemd service the playbooks act on)
#   service         : systemd unit to (re)start / health-check
#   app             : application hosted here (null for db/mail)
#   business_service: the service this server supports
#   support_group   : owning team (assignment group)
#   ssh_port        : host port mapped to the container's sshd (Ansible reaches it here)
#   app_port        : host port mapped to the app/web (for url_check health monitoring); null if none
servers:
  - {name: hr-web-01,  role: web, service: hr-portal,  app: hr-portal, business_service: HR Self-Service,      support_group: HR-IT,    os: RHEL 9, env: production, ssh_port: 2211, app_port: 9081}
  - {name: hr-db-01,   role: db,  service: postgresql, app: null,      business_service: HR Self-Service,      support_group: DBA,      os: RHEL 9, env: production, ssh_port: 2212, app_port: null}
  - {name: crm-web-01, role: web, service: crm,        app: crm,       business_service: Customer Relations,      support_group: CRM Team, os: RHEL 9, env: production, ssh_port: 2213, app_port: 9082}
  - {name: crm-web-02, role: web, service: crm,        app: crm,       business_service: Customer Relations,      support_group: CRM Team, os: RHEL 9, env: production, ssh_port: 2214, app_port: 9083}
  - {name: crm-db-01,  role: db,  service: postgresql, app: null,      business_service: Customer Relations,      support_group: DBA,      os: RHEL 9, env: production, ssh_port: 2215, app_port: null}
  - {name: intra-01,   role: web, service: httpd,      app: intranet,  business_service: Intranet,             support_group: Collab,   os: RHEL 9, env: production, ssh_port: 2216, app_port: 9084}
  - {name: ged-01,     role: app, service: ged,        app: ged,       business_service: Document Management, support_group: ECM,      os: RHEL 9, env: production, ssh_port: 2217, app_port: 9085}
  - {name: ged-db-01,  role: db,  service: postgresql, app: null,      business_service: Document Management, support_group: DBA,      os: RHEL 9, env: production, ssh_port: 2218, app_port: null}
  - {name: mail-01,    role: mail, service: postfix,   app: null,      business_service: Mail,           support_group: Infra,    os: RHEL 9, env: production, ssh_port: 2219, app_port: null}

