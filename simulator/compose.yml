# Meridian Group fleet — 9 containers standing in for the servers in fleet.yml.
# Build the images first with deploy.sh, then:  podman compose -f simulator/compose.yml up -d
# Ports match fleet.yml: ssh 221x (Ansible) and app 908x (url_check health monitoring).
# The EE/DE reach these via host.containers.internal:<published port>.
x-server: &server
  restart: unless-stopped
  tmpfs: ["/run", "/run/lock"]      # systemd (ubi9-init) needs a writable /run

services:
  hr-web-01:
    <<: *server
    image: localhost/meridian-hr-portal:latest
    container_name: hr-web-01
    hostname: hr-web-01
    ports: ["2211:22", "9081:8000"]
    # SSO (Étape 2). Browser + back-channel both use the external issuer (via the edge), so the
    # token issuer stays consistent; the edge has a network alias for ${FQDN} so this resolves
    # inside the compose network. Empty values (no Keycloak) -> the app runs open (auth disabled).
    environment:
      OIDC_ISSUER: https://${FQDN}:9443/auth/realms/meridian
      OIDC_CLIENT_ID: hr-portal
      OIDC_CLIENT_SECRET: ${KC_HRPORTAL_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: https://${FQDN}:9443/hr/callback
      APP_BASE_URL: https://${FQDN}:9443/hr
      SESSION_SECRET: ${HRPORTAL_SESSION_SECRET:-change-me-session}
      # HR business data (read-only) from Postgres on hr-db-01 — trust auth for the hr_app role.
      HR_DB_HOST: hr-db-01
      HR_DB_NAME: hr
      HR_DB_USER: hr_app

  hr-db-01:
    <<: *server
    image: localhost/meridian-db:latest
    container_name: hr-db-01
    hostname: hr-db-01
    ports: ["2212:22"]

  crm-web-01:
    <<: *server
    image: localhost/meridian-crm:latest
    container_name: crm-web-01
    hostname: crm-web-01
    ports: ["2213:22", "9082:8000"]

  crm-web-02:
    <<: *server
    image: localhost/meridian-crm:latest
    container_name: crm-web-02
    hostname: crm-web-02
    ports: ["2214:22", "9083:8000"]

  crm-db-01:
    <<: *server
    image: localhost/meridian-db:latest
    container_name: crm-db-01
    hostname: crm-db-01
    ports: ["2215:22"]

  intra-01:
    <<: *server
    image: localhost/meridian-intranet:latest
    container_name: intra-01
    hostname: intra-01
    ports: ["2216:22", "9084:80"]

  ged-01:
    <<: *server
    image: localhost/meridian-ged:latest
    container_name: ged-01
    hostname: ged-01
    ports: ["2217:22", "9085:8000"]

  ged-db-01:
    <<: *server
    image: localhost/meridian-db:latest
    container_name: ged-db-01
    hostname: ged-db-01
    ports: ["2218:22"]

  mail-01:
    <<: *server
    image: localhost/meridian-mail:latest
    container_name: mail-01
    hostname: mail-01
    ports: ["2219:22"]

  # Edge gateway / DMZ "firewall" — the internet-facing entry. Terminates TLS on :9443 (AAP owns
  # :443 on this VM) and path-routes to the internal apps + the corporate IdP. :80 redirects to
  # :9443. NSG must open :9443. FQDN is needed for the TLS cert (Caddy internal CA) + redirect.
  edge:
    image: docker.io/library/caddy:2
    container_name: meridian-edge
    hostname: edge
    ports: ["80:80", "9443:9443"]
    environment:
      FQDN: ${FQDN}
    volumes:
      - ./apps/edge/Caddyfile:/etc/caddy/Caddyfile:ro,Z
    depends_on: [keycloak]
    # Resolve ${FQDN} to the edge inside the compose network, so server-side OIDC calls from the
    # apps reach Keycloak through the edge (consistent external issuer) without NAT hairpinning.
    networks:
      default:
        aliases: ["${FQDN}"]
    restart: unless-stopped

  # Corporate IdP — Meridian's single sign-on (Keycloak). Browser-facing only through the edge at
  # https://<FQDN>:9443/auth (no published port of its own). Dev mode (H2, ephemeral) for the PoC;
  # KC_PROXY_HEADERS lets it build correct https URLs from the edge's X-Forwarded-* headers.
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak
    hostname: keycloak
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
    restart: unless-stopped
