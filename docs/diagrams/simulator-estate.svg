<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" role="img" aria-label="Meridian Group — the server fleet (infrastructure)">
  <defs>
    <style>
      text { font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .h1 { font-size: 28px; font-weight: 700; fill: #1f2328; }
      .zone { font-size: 12.5px; font-weight: 700; fill: #8b949e; letter-spacing: .7px; }
      .nm { font-size: 14.5px; font-weight: 700; }
      .sub { font-size: 11.5px; fill: #8b949e; }
      .role { font-size: 11px; font-weight: 700; fill: #ffffff; }
      .leg { font-size: 13px; fill: #57606a; }
      .elbl { font-size: 11.5px; font-weight: 700; fill: #57606a; }
      .node { fill: #ffffff; stroke: #d7dde3; stroke-width: 1.4; }
    </style>
    <filter id="sh" x="-12%" y="-12%" width="124%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.10"/></filter>
    <marker id="link" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="flow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <g id="srv"><rect x="-10" y="-11" width="20" height="6.4" rx="1.5" fill="currentColor"/><rect x="-10" y="-2.7" width="20" height="6.4" rx="1.5" fill="currentColor"/><rect x="-10" y="5.6" width="20" height="6.4" rx="1.5" fill="currentColor"/><circle cx="5.5" cy="-7.8" r="1.1" fill="#fff"/><circle cx="5.5" cy="0.5" r="1.1" fill="#fff"/><circle cx="5.5" cy="8.8" r="1.1" fill="#fff"/></g>
    <g id="db"><ellipse cx="0" cy="-9" rx="11" ry="4" fill="currentColor"/><path d="M-11,-9 V9 a11,4 0 0 0 22,0 V-9 a11,4 0 0 1 -22,0" fill="currentColor"/><ellipse cx="0" cy="-9" rx="11" ry="4" fill="#ffffff" fill-opacity="0.30"/></g>
    <g id="lock"><rect x="-9" y="-1" width="18" height="13" rx="2.5" fill="currentColor"/><path d="M-5.5,-1 V-5 a5.5,5.5 0 0 1 11,0 V-1" fill="none" stroke="currentColor" stroke-width="2.6"/></g>
    <g id="ppl"><circle cx="0" cy="-4" r="5.5" fill="currentColor"/><path d="M-9,12 C-9,2 9,2 9,12 Z" fill="currentColor"/></g>
  </defs>

  <rect x="0" y="0" width="1600" height="560" fill="#ffffff"/>
  <text class="h1" x="40" y="46">Meridian Group — the server fleet</text>

  <!-- external users -->
  <g filter="url(#sh)"><rect class="node" x="88" y="64" width="180" height="42" rx="10"/>
    <use href="#ppl" x="116" y="86" color="#57606a"/><text class="nm" x="138" y="91" fill="#1f2328">Users · browser</text></g>
  <path d="M178,106 L178,166" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#flow)"/>
  <text class="elbl" x="188" y="142">:9443 (TLS)</text>

  <!-- ===================== Private network boundary ===================== -->
  <rect x="40" y="124" width="1520" height="384" rx="16" fill="#f6f8fa" stroke="#c7ced6" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text class="zone" x="62" y="150">MERIDIAN · PRIVATE NETWORK</text>

  <!-- DMZ band -->
  <rect x="64" y="162" width="980" height="78" rx="12" fill="#eef1f5"/>
  <text class="zone" x="84" y="182" fill="#9aa3ad">DMZ · EDGE</text>
  <g filter="url(#sh)"><rect class="node" x="84" y="188" width="448" height="46" rx="10"/>
    <use href="#srv" x="112" y="212" color="#475569"/>
    <text class="nm" x="136" y="207" fill="#475569">edge</text><text class="sub" x="178" y="207">Caddy · reverse proxy</text>
    <text class="sub" x="136" y="224">TLS :9443  ·  :80 → :9443</text></g>
  <g filter="url(#sh)"><rect class="node" x="576" y="188" width="448" height="46" rx="10"/>
    <use href="#lock" x="602" y="212" color="#4338ca"/>
    <text class="nm" x="624" y="207" fill="#4338ca">Keycloak</text>
    <rect x="724" y="196" width="44" height="18" rx="5" fill="#4338ca"/><text class="role" x="746" y="209" text-anchor="middle">IdP</text>
    <text class="sub" x="624" y="224">realm meridian  ·  /auth</text></g>
  <path d="M532,211 L576,211" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#flow)"/>
  <text class="elbl" x="538" y="203">/auth</text>
  <path d="M178,234 L178,296" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#flow)"/>
  <text class="elbl" x="188" y="270">/ → apps</text>

  <!-- ===================== WEB / APP TIER ===================== -->
  <text class="zone" x="74" y="288" fill="#9aa3ad">WEB / APP TIER</text>
  <path d="M178,344 L178,426" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#link)"/>
  <path d="M428,344 L553,426" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#link)"/>
  <path d="M678,344 L553,426" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#link)"/>
  <path d="M1178,344 L1178,426" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#link)"/>

  <g filter="url(#sh)"><rect class="node" x="64" y="300" width="228" height="44" rx="10"/><use href="#srv" x="92" y="324" color="#2563eb"/><text class="nm" x="116" y="329" fill="#2563eb">hr-web-01</text><rect x="238" y="313" width="44" height="18" rx="5" fill="#8b949e"/><text class="role" x="260" y="326" text-anchor="middle">web</text></g>
  <g filter="url(#sh)"><rect class="node" x="314" y="300" width="228" height="44" rx="10"/><use href="#srv" x="342" y="324" color="#0d9488"/><text class="nm" x="366" y="329" fill="#0d9488">crm-web-01</text><rect x="488" y="313" width="44" height="18" rx="5" fill="#8b949e"/><text class="role" x="510" y="326" text-anchor="middle">web</text></g>
  <g filter="url(#sh)"><rect class="node" x="564" y="300" width="228" height="44" rx="10"/><use href="#srv" x="592" y="324" color="#0d9488"/><text class="nm" x="616" y="329" fill="#0d9488">crm-web-02</text><rect x="738" y="313" width="44" height="18" rx="5" fill="#8b949e"/><text class="role" x="760" y="326" text-anchor="middle">web</text></g>
  <g filter="url(#sh)"><rect class="node" x="814" y="300" width="228" height="44" rx="10"/><use href="#srv" x="842" y="324" color="#ea580c"/><text class="nm" x="866" y="329" fill="#ea580c">intra-01</text><rect x="988" y="313" width="44" height="18" rx="5" fill="#8b949e"/><text class="role" x="1010" y="326" text-anchor="middle">web</text></g>
  <g filter="url(#sh)"><rect class="node" x="1064" y="300" width="228" height="44" rx="10"/><use href="#srv" x="1092" y="324" color="#7c3aed"/><text class="nm" x="1116" y="329" fill="#7c3aed">ged-01</text><rect x="1238" y="313" width="44" height="18" rx="5" fill="#8b949e"/><text class="role" x="1260" y="326" text-anchor="middle">app</text></g>
  <g filter="url(#sh)"><rect class="node" x="1314" y="300" width="228" height="44" rx="10"/><use href="#srv" x="1342" y="324" color="#475569"/><text class="nm" x="1366" y="329" fill="#475569">mail-01</text><rect x="1486" y="313" width="50" height="18" rx="5" fill="#475569"/><text class="role" x="1511" y="326" text-anchor="middle">mail</text></g>

  <!-- ===================== DATA TIER ===================== -->
  <text class="zone" x="74" y="414" fill="#9aa3ad">DATA TIER</text>
  <g filter="url(#sh)"><rect class="node" x="64" y="426" width="228" height="44" rx="10"/><use href="#db" x="94" y="450" color="#be123c"/><text class="nm" x="118" y="453" fill="#2563eb">hr-db-01</text><rect x="246" y="439" width="36" height="18" rx="5" fill="#be123c"/><text class="role" x="264" y="452" text-anchor="middle">db</text></g>
  <g filter="url(#sh)"><rect class="node" x="439" y="426" width="228" height="44" rx="10"/><use href="#db" x="469" y="450" color="#be123c"/><text class="nm" x="493" y="453" fill="#0d9488">crm-db-01</text><rect x="621" y="439" width="36" height="18" rx="5" fill="#be123c"/><text class="role" x="639" y="452" text-anchor="middle">db</text></g>
  <g filter="url(#sh)"><rect class="node" x="1064" y="426" width="228" height="44" rx="10"/><use href="#db" x="1094" y="450" color="#be123c"/><text class="nm" x="1118" y="453" fill="#7c3aed">ged-db-01</text><rect x="1246" y="439" width="36" height="18" rx="5" fill="#be123c"/><text class="role" x="1264" y="452" text-anchor="middle">db</text></g>

  <!-- legend (bottom) -->
  <g transform="translate(40,534)">
    <text class="leg" x="0" y="12" font-weight="700">Colour = owning team:</text>
    <circle cx="178" cy="8" r="6" fill="#2563eb"/><text class="leg" x="190" y="12">HR-IT</text>
    <circle cx="258" cy="8" r="6" fill="#0d9488"/><text class="leg" x="270" y="12">CRM</text>
    <circle cx="330" cy="8" r="6" fill="#ea580c"/><text class="leg" x="342" y="12">Collab</text>
    <circle cx="416" cy="8" r="6" fill="#7c3aed"/><text class="leg" x="428" y="12">ECM</text>
    <circle cx="488" cy="8" r="6" fill="#475569"/><text class="leg" x="500" y="12">Infra</text>
    <text class="leg" x="580" y="12">databases (<tspan fill="#be123c" font-weight="700">rose</tspan>) = DBA team   ·   each web/app server talks to its database.</text>
  </g>
</svg>
