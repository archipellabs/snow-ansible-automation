<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 440" width="1600" height="440" role="img" aria-label="Meridian Group — one manifest, many consumers">
  <defs>
    <style>
      text { font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .h1 { font-size: 28px; font-weight: 700; fill: #1f2328; }
      .src { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .srcs { font-size: 12px; fill: #ffffff; fill-opacity: .75; }
      .item { font-size: 13px; fill: #ffffff; fill-opacity: .92; }
      .nm { font-size: 15px; font-weight: 700; }
      .sub { font-size: 12px; fill: #57606a; }
      .lab { font-size: 11.5px; font-weight: 700; fill: #57606a; }
      .card { fill: #ffffff; stroke: #d7dde3; stroke-width: 1.4; }
      .foot { font-size: 13px; fill: #57606a; }
    </style>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.10"/></filter>
    <marker id="ar" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <g id="srv"><rect x="-10" y="-11" width="20" height="6.4" rx="1.5" fill="currentColor"/><rect x="-10" y="-2.7" width="20" height="6.4" rx="1.5" fill="currentColor"/><rect x="-10" y="5.6" width="20" height="6.4" rx="1.5" fill="currentColor"/><circle cx="5.5" cy="-7.8" r="1.1" fill="#fff"/><circle cx="5.5" cy="0.5" r="1.1" fill="#fff"/><circle cx="5.5" cy="8.8" r="1.1" fill="#fff"/></g>
    <g id="db"><ellipse cx="0" cy="-9" rx="11" ry="4" fill="currentColor"/><path d="M-11,-9 V9 a11,4 0 0 0 22,0 V-9 a11,4 0 0 1 -22,0" fill="currentColor"/><ellipse cx="0" cy="-9" rx="11" ry="4" fill="#ffffff" fill-opacity="0.30"/></g>
    <g id="lock"><rect x="-9" y="-1" width="18" height="13" rx="2.5" fill="currentColor"/><path d="M-5.5,-1 V-5 a5.5,5.5 0 0 1 11,0 V-1" fill="none" stroke="currentColor" stroke-width="2.6"/></g>
    <g id="list"><circle cx="-8" cy="-7" r="1.7" fill="currentColor"/><rect x="-3" y="-8.5" width="15" height="3" rx="1.5" fill="currentColor"/><circle cx="-8" cy="0" r="1.7" fill="currentColor"/><rect x="-3" y="-1.5" width="15" height="3" rx="1.5" fill="currentColor"/><circle cx="-8" cy="7" r="1.7" fill="currentColor"/><rect x="-3" y="5.5" width="15" height="3" rx="1.5" fill="currentColor"/></g>
    <g id="doc"><rect x="-9" y="-12" width="18" height="24" rx="2.5" fill="currentColor"/><rect x="-5" y="-7" width="10" height="2" rx="1" fill="#1f2937"/><rect x="-5" y="-2.5" width="10" height="2" rx="1" fill="#1f2937"/><rect x="-5" y="2" width="7" height="2" rx="1" fill="#1f2937"/></g>
  </defs>

  <rect x="0" y="0" width="1600" height="440" fill="#ffffff"/>
  <text class="h1" x="40" y="46">Meridian Group — one manifest, many consumers</text>

  <!-- source of truth -->
  <g filter="url(#sh)">
    <rect x="48" y="96" width="330" height="280" rx="14" fill="#1f2937"/>
    <use href="#doc" x="92" y="146" color="#ffffff"/>
    <text class="src" x="120" y="142">simulator/fleet.yml</text>
    <text class="srcs" x="120" y="162">single source of truth</text>
    <line x1="72" y1="186" x2="354" y2="186" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.2"/>
    <text class="item" x="74" y="220">▸ teams  (support groups)</text>
    <text class="item" x="74" y="256">▸ people  (staff + business users)</text>
    <text class="item" x="74" y="292">▸ apps + business services</text>
    <text class="item" x="74" y="328">▸ servers  (ports · roles · owning team)</text>
  </g>

  <!-- arrows: fleet.yml -> consumers -->
  <path d="M378,152 L556,152" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#ar)"/>
  <text class="lab" x="430" y="144">compose · sync.sh</text>
  <path d="M378,246 L556,246" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#ar)"/>
  <text class="lab" x="445" y="238">2_cmdb.py</text>
  <path d="M378,340 L556,340" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#ar)"/>
  <text class="lab" x="420" y="332">keycloak/configure.py</text>

  <!-- Containers -->
  <g filter="url(#sh)"><rect class="card" x="560" y="116" width="430" height="72" rx="12"/>
    <use href="#srv" x="600" y="153" color="#475569"/>
    <text class="nm" x="630" y="148" fill="#475569">Containers — the running fleet</text>
    <text class="sub" x="630" y="170">10 containers: apps · databases · edge · mail</text></g>

  <!-- ServiceNow CMDB -->
  <g filter="url(#sh)"><rect class="card" x="560" y="210" width="430" height="72" rx="12"/>
    <use href="#db" x="600" y="252" color="#1c7c54"/>
    <text class="nm" x="630" y="242" fill="#1c7c54">ServiceNow CMDB</text>
    <text class="sub" x="630" y="264">server CIs · apps · services · relations · people · teams</text></g>

  <!-- Keycloak -->
  <g filter="url(#sh)"><rect class="card" x="560" y="304" width="430" height="72" rx="12"/>
    <use href="#lock" x="602" y="345" color="#4338ca"/>
    <text class="nm" x="630" y="336" fill="#4338ca">Keycloak realm</text>
    <text class="sub" x="630" y="358">groups (teams) · users (people) · clients</text></g>

  <!-- CMDB -> dynamic inventory (downstream) -->
  <path d="M990,246 L1062,246" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#ar)"/>
  <text class="lab" x="1000" y="238">servicenow.itsm.now</text>
  <g filter="url(#sh)"><rect class="card" x="1066" y="210" width="470" height="72" rx="12"/>
    <use href="#list" x="1106" y="251" color="#c0392b"/>
    <text class="nm" x="1136" y="242" fill="#c0392b">Controller dynamic inventory</text>
    <text class="sub" x="1136" y="264">9 hosts + host vars (port · role · service · team) — read from the CMDB</text></g>

  <text class="foot" x="48" y="412">Add or retire anything in <tspan font-weight="700" fill="#1f2328">fleet.yml</tspan> and it propagates everywhere on the next run — no source drifts out of sync.</text>
</svg>
