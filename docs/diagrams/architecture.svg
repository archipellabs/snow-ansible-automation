<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1960 1060" width="1960" height="1060" role="img" aria-label="AAP and ServiceNow control-plane architecture">
  <defs>
    <style>
      text { font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .h1 { font-size: 31px; font-weight: 700; fill: #1f2328; }
      .h2 { font-size: 17px; fill: #57606a; }
      .boxt { font-size: 20px; font-weight: 700; fill: #1f2328; }
      .boxs { font-size: 14.5px; fill: #57606a; }
      .sub { font-size: 13px; font-weight: 600; fill: #8a929c; letter-spacing: .3px; }
      .chip { font-size: 13px; font-weight: 600; fill: #1f2328; }
      .vmh { font-size: 21px; font-weight: 700; fill: #0a4a8f; }
      .vms { font-size: 14.5px; fill: #3b6ea5; }
      .esth { font-size: 19px; font-weight: 700; fill: #1f5e5e; }
      .ests { font-size: 14px; fill: #2a7d7d; }
      .num { font-size: 16px; font-weight: 700; }
      .leg { font-size: 15px; fill: #3a3f45; }
      .legt { font-size: 18px; font-weight: 700; fill: #1f2328; }
      .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.4; }
      .edge { fill: none; stroke-width: 2.4; }
      .sup { fill: none; stroke: #6b7280; stroke-width: 1.8; stroke-dasharray: 7 5; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/></filter>
    <marker id="ah-green" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c7c54"/></marker>
    <marker id="ah-red" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="ah-orange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e08e0b"/></marker>
    <marker id="ah-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker>
    <marker id="ah-purple" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fa0"/></marker>
    <marker id="ah-gray" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>

  <rect x="0" y="0" width="1960" height="1060" fill="#ffffff"/>
  <text class="h1" x="46" y="48">Architecture — one AAP, both directions</text>
  <text class="h2" x="46" y="76">EDA polls ServiceNow for incidents (pull) and ServiceNow pushes approved changes through a gateway Event Stream (push). Everything except ServiceNow runs as rootless podman containers on one VM.</text>

  <!-- ===================== SUPPLY (top-left) ===================== -->
  <g filter="url(#shadow)"><rect class="card" x="46" y="98" width="300" height="80" rx="10"/><rect x="46" y="98" width="6" height="80" rx="3" fill="#cc4400"/>
    <text class="boxt" x="66" y="128">registry.redhat.io</text><text class="boxs" x="66" y="154">AAP base images (de-minimal · ee)</text></g>
  <g filter="url(#shadow)"><rect class="card" x="362" y="98" width="300" height="80" rx="10"/><rect x="362" y="98" width="6" height="80" rx="3" fill="#24292f"/>
    <text class="boxt" x="382" y="128">GitHub · config-as-code</text><text class="boxs" x="382" y="154">playbooks · rulebooks · EDA vars</text></g>

  <!-- ===================== SERVICENOW (top-right) ===================== -->
  <g filter="url(#shadow)" transform="translate(140,0)">
    <rect class="card" x="1240" y="98" width="540" height="294" rx="10"/>
    <rect x="1240" y="98" width="6" height="294" rx="3" fill="#1c7c54"/>
    <text class="boxt" x="1262" y="128">ServiceNow PDI · SaaS</text>
    <text class="boxs" x="1262" y="150">system of record — ITSM + CMDB</text>
    <g><rect x="1262" y="162" width="124" height="27" rx="6" fill="#e8f6ef" stroke="#1c7c54" stroke-width="1.1"/><text class="chip" x="1274" y="180">Incident table</text></g>
    <g><rect x="1398" y="162" width="128" height="27" rx="6" fill="#e8f6ef" stroke="#1c7c54" stroke-width="1.1"/><text class="chip" x="1410" y="180">Change Request</text></g>
    <g><rect x="1538" y="162" width="110" height="27" rx="6" fill="#e8f6ef" stroke="#1c7c54" stroke-width="1.1"/><text class="chip" x="1550" y="180">Catalog item</text></g>
    <g><rect x="1262" y="198" width="124" height="27" rx="6" fill="#e8f6ef" stroke="#1c7c54" stroke-width="1.1"/><text class="chip" x="1274" y="216">Meridian CMDB</text></g>
    <g><rect x="1398" y="198" width="118" height="27" rx="6" fill="#e8f6ef" stroke="#1c7c54" stroke-width="1.1"/><text class="chip" x="1410" y="216">Business Rule</text></g>
    <g><rect x="1262" y="234" width="298" height="27" rx="6" fill="#e8f6ef" stroke="#1c7c54" stroke-width="1.1"/><text class="chip" x="1274" y="252">svc acct eda.integration · itil · TZ GMT</text></g>
    <text class="boxs" x="1262" y="288">REST /api/now · OAuth · trust-store CA</text>
  </g>

  <!-- ===================== AZURE VM ===================== -->
  <rect x="46" y="250" width="1156" height="732" rx="16" fill="#f4f9ff" stroke="#0078d4" stroke-width="2"/>

  <g transform="translate(54,0)">
    <text class="vmh" x="72" y="284">Azure · RHEL 9 VM · rootless podman</text>
    <text class="vms" x="72" y="306">AAP 2.7 containerized (~24 containers) · NSG inbound 22 / 80 / 443</text>

    <!-- Platform Gateway -->
    <g filter="url(#shadow)"><rect class="card" x="72" y="330" width="1052" height="86" rx="10"/><rect x="72" y="330" width="6" height="86" rx="3" fill="#0078d4"/>
      <text class="boxt" x="92" y="360">Platform Gateway · TLS :443</text>
      <g><rect x="92" y="372" width="142" height="27" rx="6" fill="#e7f1fb" stroke="#0078d4" stroke-width="1.1"/><text class="chip" x="104" y="390">/api/controller/</text></g>
      <g><rect x="246" y="372" width="92" height="27" rx="6" fill="#e7f1fb" stroke="#0078d4" stroke-width="1.1"/><text class="chip" x="258" y="390">/api/eda/</text></g>
      <g><rect x="350" y="372" width="158" height="27" rx="6" fill="#e7f1fb" stroke="#0078d4" stroke-width="1.1"/><text class="chip" x="362" y="390">Event Streams (push)</text></g></g>

    <!-- EDA Controller -->
    <g filter="url(#shadow)"><rect class="card" x="72" y="436" width="524" height="200" rx="10"/><rect x="72" y="436" width="6" height="200" rx="3" fill="#c0392b"/>
      <text class="boxt" x="92" y="464">EDA Controller</text>
      <text class="sub" x="92" y="484">ACTIVATIONS</text>
      <g><rect x="92" y="490" width="208" height="27" rx="6" fill="#fbeae8" stroke="#c0392b" stroke-width="1.1"/><text class="chip" x="104" y="508">pull-incident-remediation</text></g>
      <g><rect x="310" y="490" width="128" height="27" rx="6" fill="#fbeae8" stroke="#c0392b" stroke-width="1.1"/><text class="chip" x="322" y="508">monitor-health</text></g>
      <g><rect x="92" y="523" width="182" height="27" rx="6" fill="#fbeae8" stroke="#c0392b" stroke-width="1.1"/><text class="chip" x="104" y="541">push-change-execution</text></g>
      <g><rect x="284" y="523" width="140" height="27" rx="6" fill="#fbeae8" stroke="#c0392b" stroke-width="1.1"/><text class="chip" x="296" y="541">push-selfservice</text></g>
      <text class="boxs" x="92" y="586">rulebooks ← Git · sources → gateway</text></g>

    <!-- Decision Environment (transient) -->
    <g filter="url(#shadow)"><rect x="612" y="436" width="512" height="200" rx="10" fill="#faf7ff" stroke="#6b3fa0" stroke-width="1.6" stroke-dasharray="8 5"/><rect x="612" y="436" width="6" height="200" rx="3" fill="#6b3fa0"/>
      <text class="boxt" x="632" y="464">Decision Environment · transient</text>
      <g><rect x="632" y="476" width="146" height="27" rx="6" fill="#f1ebfa" stroke="#6b3fa0" stroke-width="1.1"/><text class="chip" x="644" y="494">image: snow-eda-de</text></g>
      <text class="boxs" x="632" y="530">de-minimal + servicenow.itsm</text>
      <text class="boxs" x="632" y="558">PULL: poll SN (10s) · PUSH: webhook</text></g>

    <!-- Automation Controller -->
    <g filter="url(#shadow)"><rect class="card" x="72" y="676" width="524" height="200" rx="10"/><rect x="72" y="676" width="6" height="200" rx="3" fill="#c0392b"/>
      <text class="boxt" x="92" y="704">Automation Controller</text>
      <g><rect x="92" y="716" width="118" height="27" rx="6" fill="#fbeae8" stroke="#c0392b" stroke-width="1.1"/><text class="chip" x="104" y="734">Project ← Git</text></g>
      <g><rect x="220" y="716" width="148" height="27" rx="6" fill="#fbeae8" stroke="#c0392b" stroke-width="1.1"/><text class="chip" x="232" y="734">Inventory ← CMDB</text></g>
      <g><rect x="378" y="716" width="104" height="27" rx="6" fill="#fbeae8" stroke="#c0392b" stroke-width="1.1"/><text class="chip" x="390" y="734">Credentials</text></g>
      <text class="sub" x="92" y="763">JOB TEMPLATES</text>
      <g><rect x="92" y="769" width="130" height="27" rx="6" fill="#fbeae8" stroke="#c0392b" stroke-width="1.1"/><text class="chip" x="104" y="787">Restart Service</text></g>
      <g><rect x="232" y="769" width="128" height="27" rx="6" fill="#fbeae8" stroke="#c0392b" stroke-width="1.1"/><text class="chip" x="244" y="787">Execute Change</text></g>
      <g><rect x="370" y="769" width="88" height="27" rx="6" fill="#fbeae8" stroke="#c0392b" stroke-width="1.1"/><text class="chip" x="382" y="787">+ helpers</text></g>
      <text class="boxs" x="92" y="828">spawns Execution Environments →</text></g>

    <!-- Execution Environment (transient) -->
    <g filter="url(#shadow)"><rect x="612" y="676" width="512" height="200" rx="10" fill="#faf7ff" stroke="#6b3fa0" stroke-width="1.6" stroke-dasharray="8 5"/><rect x="612" y="676" width="6" height="200" rx="3" fill="#6b3fa0"/>
      <text class="boxt" x="632" y="704">Execution Environment · transient</text>
      <g><rect x="632" y="716" width="162" height="27" rx="6" fill="#f1ebfa" stroke="#6b3fa0" stroke-width="1.1"/><text class="chip" x="644" y="734">restart_service.yml</text></g>
      <g><rect x="804" y="716" width="158" height="27" rx="6" fill="#f1ebfa" stroke="#6b3fa0" stroke-width="1.1"/><text class="chip" x="816" y="734">execute_change.yml</text></g>
      <text class="boxs" x="632" y="772">SSH → host.containers.internal:221x</text>
      <text class="boxs" x="632" y="800">restart + re-check · writes back to SN</text></g>

    <!-- Automation Hub + Platform services -->
    <g filter="url(#shadow)"><rect class="card" x="72" y="908" width="524" height="58" rx="10"/><rect x="72" y="908" width="6" height="58" rx="3" fill="#6b7280"/>
      <text class="boxt" x="92" y="934">Automation Hub</text><text class="boxs" x="92" y="954">private registry · snow-eda-de:latest</text></g>
    <g filter="url(#shadow)"><rect class="card" x="612" y="908" width="512" height="58" rx="10"/><rect x="612" y="908" width="6" height="58" rx="3" fill="#6b7280"/>
      <text class="boxt" x="632" y="932">Platform services</text>
      <g><rect x="632" y="938" width="96" height="22" rx="6" fill="#eef0f2" stroke="#6b7280" stroke-width="1.1"/><text class="chip" x="642" y="954">PostgreSQL</text></g>
      <g><rect x="738" y="938" width="58" height="22" rx="6" fill="#eef0f2" stroke="#6b7280" stroke-width="1.1"/><text class="chip" x="748" y="954">Redis</text></g>
      <g><rect x="806" y="938" width="80" height="22" rx="6" fill="#eef0f2" stroke="#6b7280" stroke-width="1.1"/><text class="chip" x="816" y="954">Receptor</text></g></g>
  </g>

  <!-- ===================== MERIDIAN ESTATE (right, below ServiceNow) ===================== -->
  <g transform="translate(140,0)">
  <rect x="1240" y="452" width="540" height="530" rx="14" fill="#f3fbfa" stroke="#2a7d7d" stroke-width="1.8"/>
  <text class="esth" x="1262" y="484">Meridian estate · simulator compose</text>
  <text class="ests" x="1262" y="504">fleet targets + identity · behind the edge :9443</text>
  <g filter="url(#shadow)"><rect class="card" x="1262" y="518" width="496" height="84" rx="10"/><rect x="1262" y="518" width="6" height="84" rx="3" fill="#2a7d7d"/>
    <text class="boxt" x="1282" y="552">hr-web-01 · fleet server</text><text class="boxs" x="1282" y="578">hr-portal + /health · sshd :2211</text></g>
  <g filter="url(#shadow)"><rect class="card" x="1262" y="616" width="496" height="80" rx="10"/><rect x="1262" y="616" width="6" height="80" rx="3" fill="#2a7d7d"/>
    <text class="boxt" x="1282" y="648">… 8 more fleet servers</text><text class="boxs" x="1282" y="674">crm·ged·intranet·mail·db · sshd :2212–2219</text></g>
  <g filter="url(#shadow)"><rect class="card" x="1262" y="710" width="496" height="68" rx="10"/><rect x="1262" y="710" width="6" height="68" rx="3" fill="#1f6feb"/>
    <text class="boxt" x="1282" y="738">Edge · Caddy · TLS :9443</text><text class="boxs" x="1282" y="762">apps / /hr /crm /ged · routes /auth → Keycloak</text></g>
  <g filter="url(#shadow)"><rect class="card" x="1262" y="792" width="496" height="118" rx="10"/><rect x="1262" y="792" width="6" height="118" rx="3" fill="#6b3fa0"/>
    <text class="boxt" x="1282" y="820">Keycloak · Meridian IdP</text>
    <g><rect x="1282" y="832" width="132" height="27" rx="6" fill="#f1ebfa" stroke="#6b3fa0" stroke-width="1.1"/><text class="chip" x="1294" y="850">realm: meridian</text></g>
    <g><rect x="1426" y="832" width="172" height="27" rx="6" fill="#f1ebfa" stroke="#6b3fa0" stroke-width="1.1"/><text class="chip" x="1438" y="850">OIDC: hr-portal · aap</text></g>
    <text class="boxs" x="1282" y="884">SSO (optional) — employee apps + AAP admin login</text></g>
  </g>

  <!-- ===================== SUPPLY EDGES (gray dashed, in the left gutter) ===================== -->
  <!-- base images: registry (left) -> Hub -->
  <path class="sup" marker-end="url(#ah-gray)" d="M180,178 L180,208 L66,208 L66,936 L126,936"/>
  <text class="leg" x="96" y="202" fill="#6b7280">base images → Hub</text>
  <!-- git: GitHub (right) -> EDA + Controller -->
  <path class="sup" marker-end="url(#ah-gray)" d="M480,178 L480,232 L86,232 L86,470 L126,470"/>
  <path class="sup" marker-end="url(#ah-gray)" d="M86,470 L86,716 L126,716"/>
  <text class="leg" x="96" y="226" fill="#6b7280">git → rulebooks + playbooks</text>
  <!-- image: Hub -> EE -->
  <path class="sup" marker-end="url(#ah-gray)" d="M650,937 L658,937 L658,780 L666,780"/>
  <text class="leg" x="604" y="952" fill="#6b7280">image</text>

  <!-- ===================== RUNTIME EDGES ===================== -->
  <!-- channel lanes (left→right): ① 1232 · ⑤ 1268 · SSO 1304 · ④ 1340 ; push routes along the top -->
  <!-- ① poll: DE -> ServiceNow -->
  <path class="edge" stroke="#1c7c54" marker-end="url(#ah-green)" d="M1178,500 L1232,500 L1232,372 L1380,372"/>
  <g><rect x="1182" y="474" width="120" height="22" rx="4" fill="#ffffff"/><text class="num" x="1190" y="490" fill="#1c7c54">① poll (10s)</text></g>
  <!-- ⑤ update: EE -> ServiceNow -->
  <path class="edge" stroke="#1c7c54" marker-end="url(#ah-green)" d="M1178,800 L1268,800 L1268,346 L1380,346"/>
  <g><rect x="1182" y="782" width="96" height="20" rx="4" fill="#ffffff"/><text class="num" x="1190" y="797" fill="#1c7c54">⑤ update</text></g>
  <!-- ④ SSH: EE -> fleet -->
  <path class="edge" stroke="#1f6feb" marker-end="url(#ah-blue)" d="M1178,720 L1340,720 L1340,560 L1402,560"/>
  <g><rect x="1182" y="702" width="70" height="20" rx="4" fill="#ffffff"/><text class="num" x="1190" y="717" fill="#1f6feb">④ SSH</text></g>
  <!-- SSO: Keycloak -> Gateway top (OIDC) -->
  <path class="edge" stroke="#6b3fa0" stroke-dasharray="6 4" marker-end="url(#ah-purple)" d="M1402,836 L1304,836 L1304,316 L1120,316 L1120,330"/>
  <g><rect x="1182" y="336" width="120" height="20" rx="4" fill="#ffffff"/><text class="num" x="1190" y="351" fill="#6b3fa0">SSO · OIDC</text></g>
  <!-- push: ServiceNow -> Gateway top (Event Stream) -->
  <path class="edge" stroke="#1f6feb" stroke-dasharray="2 3" marker-end="url(#ah-blue)" d="M1380,302 L1144,302 L1144,330"/>
  <g><rect x="1170" y="282" width="186" height="22" rx="4" fill="#ffffff"/><text class="num" x="1178" y="298" fill="#1f6feb">push → Event Stream</text></g>
  <!-- ② run_job: EDA -> Controller -->
  <path class="edge" stroke="#c0392b" marker-end="url(#ah-red)" d="M388,636 L388,676"/>
  <g><rect x="398" y="642" width="226" height="24" rx="4" fill="#ffffff"/><text class="num" x="406" y="659" fill="#c0392b">② run_job_template (:443)</text></g>
  <!-- ③ spawn EE: Controller -> EE -->
  <path class="edge" stroke="#e08e0b" marker-end="url(#ah-orange)" d="M650,846 L666,846"/>
  <g><rect x="530" y="836" width="116" height="20" rx="4" fill="#ffffff"/><text class="num" x="538" y="851" fill="#e08e0b">③ spawn EE</text></g>

  <!-- ===================== LEGEND (bottom, full width) ===================== -->
  <g filter="url(#shadow)"><rect class="card" x="46" y="994" width="1868" height="54" rx="10"/>
    <text class="legt" x="66" y="1027">Legend</text>
    <line x1="160" y1="1021" x2="198" y2="1021" class="edge" stroke="#1c7c54" marker-end="url(#ah-green)"/><text class="leg" x="206" y="1027">① ServiceNow REST · poll / update</text>
    <line x1="486" y1="1021" x2="524" y2="1021" class="edge" stroke="#c0392b" marker-end="url(#ah-red)"/><text class="leg" x="532" y="1027">② run_job → Controller</text>
    <line x1="726" y1="1021" x2="764" y2="1021" class="edge" stroke="#e08e0b" marker-end="url(#ah-orange)"/><text class="leg" x="772" y="1027">③ spawn EE</text>
    <line x1="868" y1="1021" x2="906" y2="1021" class="edge" stroke="#1f6feb" marker-end="url(#ah-blue)"/><text class="leg" x="914" y="1027">④ SSH :221x</text>
    <line x1="1018" y1="1021" x2="1056" y2="1021" class="edge" stroke="#1f6feb" stroke-dasharray="2 3" marker-end="url(#ah-blue)"/><text class="leg" x="1064" y="1027">push → Event Stream</text>
    <line x1="1232" y1="1021" x2="1270" y2="1021" class="edge" stroke="#6b3fa0" stroke-dasharray="6 4" marker-end="url(#ah-purple)"/><text class="leg" x="1278" y="1027">SSO · OIDC (Keycloak ↔ AAP)</text>
    <line x1="1510" y1="1021" x2="1548" y2="1021" class="sup" marker-end="url(#ah-gray)"/><text class="leg" x="1556" y="1027">git / image supply</text>
    <rect x="1716" y="1012" width="24" height="16" rx="4" fill="#faf7ff" stroke="#6b3fa0" stroke-dasharray="6 4"/><text class="leg" x="1748" y="1027">transient</text>
  </g>
</svg>
