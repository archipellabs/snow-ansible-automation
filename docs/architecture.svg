<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060" role="img" aria-label="ServiceNow EDA AAP architecture">
  <defs>
    <style>
      text { font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .h1 { font-size: 30px; font-weight: 700; fill: #1f2328; }
      .h2 { font-size: 16px; fill: #57606a; }
      .boxt { font-size: 18px; font-weight: 700; fill: #1f2328; }
      .boxs { font-size: 13.5px; fill: #57606a; }
      .vmh { font-size: 18px; font-weight: 700; fill: #0a4a8f; }
      .vms { font-size: 13.5px; fill: #3b6ea5; }
      .elab { font-size: 13px; font-weight: 600; fill: #1f2328; }
      .leg { font-size: 13.5px; fill: #3a3f45; }
      .legt { font-size: 15px; font-weight: 700; fill: #1f2328; }
      .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.4; }
      .edge { fill: none; stroke-width: 2.2; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <marker id="ah-green" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c7c54"/></marker>
    <marker id="ah-red" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="ah-orange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e08e0b"/></marker>
    <marker id="ah-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker>
    <marker id="ah-gray" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1060" fill="#ffffff"/>
  <text class="h1" x="46" y="50">Event-Driven Incident Auto-Remediation</text>
  <text class="h2" x="46" y="78">ServiceNow → Event-Driven Ansible → Ansible Automation Platform · containerized proof of concept</text>

  <!-- ===================== EXTERNAL SYSTEMS ===================== -->
  <!-- GitHub -->
  <g filter="url(#shadow)">
    <rect class="card" x="46" y="104" width="300" height="120" rx="10"/>
    <rect x="46" y="104" width="6" height="120" fill="#24292f"/>
    <text class="boxt" x="66" y="138">GitHub (public repo)</text>
    <text class="boxs" x="66" y="162">snow-ansible-automation</text>
    <text class="boxs" x="66" y="184">playbooks + rulebooks</text>
    <text class="boxs" x="66" y="206">config-as-code source of truth</text>
  </g>
  <!-- registry.redhat.io -->
  <g filter="url(#shadow)">
    <rect class="card" x="372" y="104" width="300" height="120" rx="10"/>
    <rect x="372" y="104" width="6" height="120" fill="#cc4400"/>
    <text class="boxt" x="392" y="138">registry.redhat.io</text>
    <text class="boxs" x="392" y="162">Red Hat AAP base images</text>
    <text class="boxs" x="392" y="184">de-supported · ee · controller …</text>
    <text class="boxs" x="392" y="206">pulled via registry service account</text>
  </g>
  <!-- ServiceNow -->
  <g filter="url(#shadow)">
    <rect class="card" x="1150" y="92" width="404" height="184" rx="10"/>
    <rect x="1150" y="92" width="6" height="184" fill="#1c7c54"/>
    <text class="boxt" x="1172" y="126">ServiceNow PDI · SaaS</text>
    <text class="boxs" x="1172" y="152">Incident table (ITSM)</text>
    <text class="boxs" x="1172" y="176">assignment group: Auto-Remediation</text>
    <text class="boxs" x="1172" y="200">service account: eda.integration (itil · TZ GMT)</text>
    <text class="boxs" x="1172" y="224">CIs: app-node-1 / app-node-2</text>
    <text class="boxs" x="1172" y="252">REST: /api/now · OAuth token</text>
  </g>

  <!-- ===================== LEGEND ===================== -->
  <g filter="url(#shadow)">
    <rect class="card" x="700" y="96" width="426" height="186" rx="10"/>
    <text class="legt" x="718" y="124">Legend</text>
    <line x1="718" y1="146" x2="760" y2="146" class="edge" stroke="#1c7c54" marker-end="url(#ah-green)"/>
    <text class="leg" x="772" y="151">ServiceNow REST — poll incidents / update</text>
    <line x1="718" y1="172" x2="760" y2="172" class="edge" stroke="#c0392b" marker-end="url(#ah-red)"/>
    <text class="leg" x="772" y="177">run_job_template (EDA → Controller, :443)</text>
    <line x1="718" y1="198" x2="760" y2="198" class="edge" stroke="#e08e0b" marker-end="url(#ah-orange)"/>
    <text class="leg" x="772" y="203">spawn execution environment</text>
    <line x1="718" y1="224" x2="760" y2="224" class="edge" stroke="#1f6feb" marker-end="url(#ah-blue)"/>
    <text class="leg" x="772" y="229">SSH to targets (host.containers.internal)</text>
    <line x1="718" y1="250" x2="760" y2="250" class="edge" stroke="#6b7280" stroke-dasharray="7 5" marker-end="url(#ah-gray)"/>
    <text class="leg" x="772" y="255">git / registry / image supply</text>
    <rect x="976" y="242" width="26" height="16" rx="4" fill="#faf7ff" stroke="#6b3fa0" stroke-dasharray="6 4"/>
    <text class="leg" x="1010" y="255">transient runtime</text>
  </g>

  <!-- ===================== AZURE VM ===================== -->
  <rect x="46" y="300" width="1508" height="716" rx="16" fill="#f4f9ff" stroke="#0078d4" stroke-width="2"/>
  <text class="vmh" x="70" y="332">Azure · RHEL 9 VM · rootless podman</text>
  <text class="vms" x="70" y="354">AAP 2.7 containerized (~24 containers) · NSG inbound: 22 / 80 / 443</text>

  <!-- Platform Gateway -->
  <g filter="url(#shadow)">
    <rect class="card" x="70" y="372" width="430" height="72" rx="10"/>
    <rect x="70" y="372" width="6" height="72" fill="#0078d4"/>
    <text class="boxt" x="90" y="402">Platform Gateway · TLS :443</text>
    <text class="boxs" x="90" y="426">single entry — routes /api/controller/ · /api/eda/</text>
  </g>
  <!-- Automation Controller -->
  <g filter="url(#shadow)">
    <rect class="card" x="70" y="462" width="430" height="150" rx="10"/>
    <rect x="70" y="462" width="6" height="150" fill="#c0392b"/>
    <text class="boxt" x="90" y="496">Automation Controller</text>
    <text class="boxs" x="90" y="522">Project · Inventory · Credentials</text>
    <text class="boxs" x="90" y="546">Job template: Restart Service</text>
    <text class="boxs" x="90" y="570">spawns Execution Environments</text>
    <text class="boxs" x="90" y="594">pulls playbooks from Git</text>
  </g>
  <!-- EDA Controller -->
  <g filter="url(#shadow)">
    <rect class="card" x="70" y="630" width="430" height="150" rx="10"/>
    <rect x="70" y="630" width="6" height="150" fill="#c0392b"/>
    <text class="boxt" x="90" y="664">EDA Controller</text>
    <text class="boxs" x="90" y="690">activation: pull-incident-remediation</text>
    <text class="boxs" x="90" y="714">rulebook: pull_incident_remediation.yml</text>
    <text class="boxs" x="90" y="738">manages the Decision Environment</text>
    <text class="boxs" x="90" y="762">pulls rulebooks from Git</text>
  </g>
  <!-- Automation Hub -->
  <g filter="url(#shadow)">
    <rect class="card" x="70" y="798" width="430" height="92" rx="10"/>
    <rect x="70" y="798" width="6" height="92" fill="#c0392b"/>
    <text class="boxt" x="90" y="832">Automation Hub</text>
    <text class="boxs" x="90" y="858">private container registry</text>
    <text class="boxs" x="90" y="880">hosts snow-eda-de:latest</text>
  </g>
  <!-- Platform services -->
  <g filter="url(#shadow)">
    <rect class="card" x="70" y="908" width="430" height="64" rx="10"/>
    <rect x="70" y="908" width="6" height="64" fill="#6b7280"/>
    <text class="boxt" x="90" y="940">Platform services</text>
    <text class="boxs" x="90" y="962">PostgreSQL · Redis · Receptor</text>
  </g>

  <!-- Decision Environment (transient) -->
  <g filter="url(#shadow)">
    <rect x="560" y="462" width="380" height="180" rx="10" fill="#faf7ff" stroke="#6b3fa0" stroke-width="1.6" stroke-dasharray="8 5"/>
    <rect x="560" y="462" width="6" height="180" fill="#6b3fa0"/>
    <text class="boxt" x="580" y="496">Decision Environment</text>
    <text class="boxs" x="580" y="522">image: snow-eda-de (servicenow.itsm)</text>
    <text class="boxs" x="580" y="546">runs the rulebook (ansible-rulebook)</text>
    <text class="boxs" x="580" y="570">polls ServiceNow · fires the job</text>
    <text class="boxs" x="580" y="594">pulled from Automation Hub</text>
    <text class="boxs" x="580" y="624">transient — managed by EDA</text>
  </g>
  <!-- Execution Environment (transient) -->
  <g filter="url(#shadow)">
    <rect x="560" y="690" width="380" height="180" rx="10" fill="#faf7ff" stroke="#6b3fa0" stroke-width="1.6" stroke-dasharray="8 5"/>
    <rect x="560" y="690" width="6" height="180" fill="#6b3fa0"/>
    <text class="boxt" x="580" y="724">Execution Environment</text>
    <text class="boxs" x="580" y="750">runs remediate_ping.yml</text>
    <text class="boxs" x="580" y="774">pasta net → host.containers.internal</text>
    <text class="boxs" x="580" y="798">updates the incident via servicenow.itsm</text>
    <text class="boxs" x="580" y="828">transient — spawned per job</text>
  </g>

  <!-- Targets -->
  <g filter="url(#shadow)">
    <rect class="card" x="1010" y="470" width="470" height="140" rx="10"/>
    <rect x="1010" y="470" width="6" height="140" fill="#2a7d7d"/>
    <text class="boxt" x="1030" y="504">app-node-1 · target container</text>
    <text class="boxs" x="1030" y="530">sshd :2201 · httpd (monitored service)</text>
    <text class="boxs" x="1030" y="554">ubi9-init systemd container</text>
    <text class="boxs" x="1030" y="586">represented by CI app-node-1</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="card" x="1010" y="700" width="470" height="140" rx="10"/>
    <rect x="1010" y="700" width="6" height="140" fill="#2a7d7d"/>
    <text class="boxt" x="1030" y="734">app-node-2 · target container</text>
    <text class="boxs" x="1030" y="760">sshd :2202 · httpd (monitored service)</text>
    <text class="boxs" x="1030" y="784">ubi9-init systemd container</text>
    <text class="boxs" x="1030" y="816">represented by CI app-node-2</text>
  </g>

  <!-- ===================== EDGES ===================== -->
  <!-- supply: git -->
  <path class="edge" stroke="#6b7280" stroke-dasharray="7 5" marker-end="url(#ah-gray)" d="M120,224 L120,300 L58,300 L58,520 L70,520"/>
  <path class="edge" stroke="#6b7280" stroke-dasharray="7 5" marker-end="url(#ah-gray)" d="M150,224 L150,290 L40,290 L40,700 L70,700"/>
  <text class="elab" x="160" y="262" fill="#6b7280">git pull · playbooks / rulebooks</text>
  <!-- supply: registry -> hub -->
  <path class="edge" stroke="#6b7280" stroke-dasharray="7 5" marker-end="url(#ah-gray)" d="M520,224 L520,844 L500,844"/>
  <text class="elab" x="528" y="800" fill="#6b7280">mirror base</text>
  <!-- supply: hub -> DE -->
  <path class="edge" stroke="#6b7280" stroke-dasharray="7 5" marker-end="url(#ah-gray)" d="M500,824 L530,824 L530,600 L560,600"/>
  <text class="elab" x="436" y="700" fill="#6b7280">pull image</text>

  <!-- runtime: DE -> ServiceNow (poll) -->
  <path class="edge" stroke="#1c7c54" marker-end="url(#ah-green)" d="M860,462 L1180,276"/>
  <g><rect x="956" y="338" width="232" height="20" rx="4" fill="#ffffff" opacity="0.85"/><text class="elab" x="962" y="353" fill="#1c7c54">① poll incidents · REST / OAuth (10s)</text></g>
  <!-- runtime: DE -> Controller (run_job_template) -->
  <path class="edge" stroke="#c0392b" marker-end="url(#ah-red)" d="M560,520 L500,520"/>
  <g><rect x="372" y="430" width="320" height="20" rx="4" fill="#ffffff" opacity="0.85"/><text class="elab" x="378" y="445" fill="#c0392b">② run_job_template · :443 /api/controller/</text></g>
  <!-- runtime: Controller -> EE (spawn) -->
  <path class="edge" stroke="#e08e0b" marker-end="url(#ah-orange)" d="M500,560 L540,560 L540,760 L560,760"/>
  <g><rect x="380" y="612" width="170" height="20" rx="4" fill="#ffffff" opacity="0.9"/><text class="elab" x="386" y="627" fill="#e08e0b">③ launch → spawn EE</text></g>
  <!-- runtime: EE -> targets (SSH) -->
  <path class="edge" stroke="#1f6feb" marker-end="url(#ah-blue)" d="M940,724 L1010,540"/>
  <path class="edge" stroke="#1f6feb" marker-end="url(#ah-blue)" d="M940,772 L1010,772"/>
  <g><rect x="946" y="654" width="246" height="20" rx="4" fill="#ffffff" opacity="0.9"/><text class="elab" x="952" y="669" fill="#1f6feb">④ SSH :2201/2202 · restart httpd</text></g>
  <!-- runtime: EE -> ServiceNow (update) -->
  <path class="edge" stroke="#1c7c54" marker-end="url(#ah-green)" d="M940,736 L975,736 L975,360 L1180,360 L1180,276"/>
  <g><rect x="986" y="418" width="180" height="20" rx="4" fill="#ffffff" opacity="0.9"/><text class="elab" x="992" y="433" fill="#1c7c54">⑤ update incident</text></g>
</svg>
